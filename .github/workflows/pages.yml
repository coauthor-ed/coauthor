name: pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build the guides
        run: node tools/guides/build-guides.mjs
      - name: Check the service worker precache list
        run: node tools/check-precache.mjs
      # Copy the repo to _site, leaving out dev-only folders (tools/publish/site-files.txt).
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude-from=tools/publish/site-files.txt --exclude=_site ./ _site/
          touch _site/.nojekyll
      - name: Check the service worker precache list on the assembled site
        run: cd _site && node tools/check-precache.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
